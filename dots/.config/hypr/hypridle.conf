$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # Lock, then stop the lockscreen's fingerprint prompt before suspending:
    # some fingerprint drivers (e.g. egismoc) crash fprintd if the system
    # sleeps with a verify in flight. after_sleep_cmd restarts the prompt.
    # `qs ipc call` blocks until the shell has handled it, unlike a dispatch,
    # and the shell kills its PAM subprocess outright, so fprintd has released
    # the reader by the time this returns. Nothing re-arms it afterwards, which
    # also lets fprintd take its own sleep-delay inhibitor in time.
    before_sleep_cmd = loginctl lock-session; qs ipc -c ii call lock fingerStop
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

